name: Tender Monitoring Bot

on:
  schedule:
    # Каждый день в 06:00 UTC (~11:00 по Бишкеку, UTC+5).
    # Формат cron: минута час день месяц день_недели
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # позволяет запускать вручную из вкладки Actions

# Нужно, чтобы job мог сделать git push обратно в репозиторий
permissions:
  contents: write

concurrency:
  group: tender-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tender bot
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAILS: ${{ secrets.TO_EMAILS }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          MY_COMPANY_NAMES: ${{ vars.MY_COMPANY_NAMES }}
        run: python bot.py

      - name: Commit updated database back to repo
        run: |
          git config user.name "tender-bot"
          git config user.email "tender-bot@users.noreply.github.com"
          git add tenders_db.json sent_tenders.json
          if git diff --cached --quiet; then
            echo "Нет изменений в базе — коммит не нужен."
          else
            git commit -m "chore: update tenders_db.json [skip ci]"
            git push
          fi
